name: ci

# 三仓同形的门禁；这条仓的真端点档打一台**一次性 MinIO 进程**（对象族／分块／预签名／桶族／ACL 拒写
# ／虚主机分桶全跑它，只有公网虚主机那一档留本机，理由在下面的 SKIP 说明里）。
#
# 为什么不是容器：2026-10-18 这轮先按 `services:`／`docker run` 写并推上 master，实测拉不到镜像——
#   · `quay.io/minio/minio` 匿名拉报 `unauthorized`（手工走 registry v2 拿 pull 作用域的 token 再请求
#     `tags/list` 仍 401 ⇒ 整个命名空间关了的，不是某个 tag 没了）；
#   · Docker Hub 的社区镜像已被移除；
#   · 官方下载站 `dl.min.io/server|minio/release/linux-amd64/…` 与 `dl.min.io/client/mc/…` 一律 **410 Gone**，
#     正文原话："The open-source MinIO Server, MinIO Client (mc) and MinIO KES projects are archived
#     and no longer maintained … These files are no longer served from this site."
# 还活着的通道是归档仓的 **GitHub Release 资产**：minio/minio 与 minio/mc 的 release 里仍挂着
# `linux-amd64` 二进制与 `.sha256sum`。所以这里按代次固定、按 sha256 校验后直接跑二进制，不起容器。
#
# 钉的这两代不是随手挑的：
#   · MinIO `RELEASE.2025-09-07T16-13-09Z` ＝ 本机对着跑并取出那些读数的那一代
#     （桶里现读的 `minio --version` 同号）⇒ CI 里的端点与本地证据同源；
#   · mc `RELEASE.2025-08-13T08-35-41Z` ＝ mc 归档仓最后一个还带 linux-amd64 资产的代次。
# 两个 sha256 都写死在这儿：仓库已归档，资产被换掉的可能性极低，但"下载的字节就是那代产物"这件事
# 值得花一行断言。校验用 `cut -f1` 取字段，不用 `sha256sum -c`——那文件里记的名字是
# `minio.RELEASE.…` 而资产叫 `minio.linux-amd64.RELEASE.…`，`-c` 会因文件名不符而失败（现读确认过）。
#
# 只有这一档故意不跑、且必须响亮 SKIP（别当成覆盖到了）：
#   · S3_VHOST_*：需要一个**公网可达**、又按 Host 里桶名分流的端点——runner 里那台只听本机，
#     给不出公网地址。它测的是"我们发的虚主机 URL 在真云上走不走得通"，本机对真端点跑过。
#
# 其余 MinIO 族的腿都在 CI 里真跑，包括两档曾被我判为"搬不进来"的：
#   · ACL 拒写档（S3_ACL_REFUSE_*）：`PUT ?acl` 回 NotImplemented，而同一请求换错密钥回
#     SignatureDoesNotMatch ⇒ 拒的是操作不是形状。这条就是 `supports_acl=false` 的行为判据。
#   · 虚主机本地档（S3_VHL_*）：要 MinIO 起在 `MINIO_DOMAIN=localhost` 上才按 Host 取桶名。
#     没设 domain 的实例对同一请求回 400 "unsupported API call for method: PUT at '/'"——
#     我 2026-10-18 就是拿那台误判成"这代 MinIO 不支持虚主机"，实测更正（文件头注释里那条旧记录是对的）。
#     还要客户端把 `<bucket>.localhost` 解析回环：Linux glibc 对 `.localhost` 有特例，本机 wasm 档实测可解析；
#     runner 上万一不解析，这一腿会**红**而不是悄悄跳过——代价是一次 CI，不是假绿。
#
# 本机按与这里完全相同的 env 形状实测过两组：只给 S3_LIVE_* → 46 全绿、SKIP 3；
# S3_LIVE_*＋S3_ACL_REFUSE_*＋S3_VHL_* 全给 → 46 全绿、SKIP 恰好 1（就是上面那档公网的）。
# ⇒ 条数断言钉成"恰好 1"：多一条是夹具掉了，少一条是有人把公网那档偷偷接上了。
#
# 用例条数断言不许删：wasm-gc 那档会静默丢掉异步用例而退出码仍为 0，条数是"真跑过"的唯一证据。
# 条数与改动同笔更新；对不上先现读再改，严禁拿删断言变绿。

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "检查全绿后是否发布到 mooncakes（tag 触发默认发布；手动触发需显式勾选）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check / Build / Test (wasm + native, live MinIO)
    runs-on: ubuntu-latest
    env:
      # 现读不是抄来的：`moon test --target wasm` 本机跑出来的总档数（含两条兼容平台腿各 4 档）。
      # 动过用例就重跑一遍再读，别把这个数当契约继承。
      EXPECTED_TESTS: "59"
      # SKIP 的期望值在 Test 那一步里**按 secret 到位情况算**（want_skips），
      # 不再钉死：钉死会让"某档没人供凭据"变成永久安静跳过，而那等于没有套件。
      MINIO_USER: moonfsci
      MINIO_PASS: moonfsci-pw-1
      BUCKET: moonfs-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MINIO_REL: RELEASE.2025-09-07T16-13-09Z
      MINIO_SHA: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      MC_REL: RELEASE.2025-08-13T08-35-41Z
      MC_SHA: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      # 抓取带重试：GitHub Release 资产偶发 502；重试的是"拿到那代产物"，sha256 不匹配一律红。
      - name: Fetch the pinned MinIO server and client binaries
        run: |
          BIN="$RUNNER_TEMP/bin"; mkdir -p "$BIN"
          fetch() { # $1=url $2=out $3=expected-sha
            local tries=1
            until curl -fsSL --retry 3 --retry-delay 5 "$1" -o "$2"; do
              if [ "$tries" -ge 3 ]; then echo "::error::资产拉不下来：$1"; return 1; fi
              tries=$((tries + 1)); sleep 15
            done
            local got; got=$(sha256sum "$2" | cut -d' ' -f1)
            if [ "$got" != "$3" ]; then
              echo "::error::sha256 不符（期望 $3，实得 $got）——不是那代产物，别继续"
              return 1
            fi
            echo "  $(basename "$2") sha256 已核"
          }
          fetch "https://github.com/minio/minio/releases/download/$MINIO_REL/minio.linux-amd64.$MINIO_REL" \
                "$BIN/minio" "$MINIO_SHA"
          fetch "https://github.com/minio/mc/releases/download/$MC_REL/mc.linux-amd64.$MC_REL" \
                "$BIN/mc" "$MC_SHA"
          chmod +x "$BIN/minio" "$BIN/mc"
          "$BIN/minio" --version
          echo "MinIO 代次＝$MINIO_REL（与本机取读数那代同号）· mc＝$MC_REL" >> "$GITHUB_STEP_SUMMARY"

      # 单节点、数据目录在 RUNNER_TEMP 里 ⇒ 随 job 销毁。GH 托管 runner 是单机一次性 VM，
      # 9000 绑在不对外暴露的地址上；测试一律打 127.0.0.1:9000。
      # 启动姿势照本机那台现役容器的 Args（`server <dir> --console-address ":9001"`），不是猜的——
      # 那台的 Args 现读就是这个代次（RELEASE.2025-09-07）在用的写法。
      - name: Start a throwaway MinIO for this run
        run: |
          mkdir -p "$RUNNER_TEMP/moonfs-data"
          # MINIO_DOMAIN=localhost 是虚主机那档的开关：设了它才会从 Host 的首个标签取桶名，
          # 不设则同样的请求回 400（判据见文件头）。路径式请求不受影响——Host 不以 .localhost 结尾。
          MINIO_ROOT_USER="$MINIO_USER" MINIO_ROOT_PASSWORD="$MINIO_PASS" MINIO_DOMAIN=localhost \
            nohup "$RUNNER_TEMP/bin/minio" server "$RUNNER_TEMP/moonfs-data" \
              --console-address ":9001" \
              > "$RUNNER_TEMP/minio.log" 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "::error::MinIO 60s 内没起来"; cat "$RUNNER_TEMP/minio.log"; exit 1; }
          echo "MinIO 就绪（health/live 200）"

      # 对象族那几条腿要求桶已存在；桶名带 run_id＋run_attempt，绝不碰别的桶。
      - name: Create the run's bucket
        run: |
          export MC_CONFIG_DIR="$RUNNER_TEMP/mc-config"; mkdir -p "$MC_CONFIG_DIR"
          "$RUNNER_TEMP/bin/mc" alias set local http://127.0.0.1:9000 "$MINIO_USER" "$MINIO_PASS" >/dev/null
          "$RUNNER_TEMP/bin/mc" mb "local/$BUCKET"
          "$RUNNER_TEMP/bin/mc" ls local | grep -F "$BUCKET"

      - name: Check
        run: moon check --target wasm --no-render

      - name: Build
        run: |
          moon build --target wasm --no-render
          moon build --target native --no-render

      - name: Test
        env:
          S3_LIVE_ENDPOINT: http://127.0.0.1:9000
          S3_LIVE_REGION: us-east-1
          S3_LIVE_AK: ${{ env.MINIO_USER }}
          S3_LIVE_SK: ${{ env.MINIO_PASS }}
          S3_LIVE_BUCKET: ${{ env.BUCKET }}
          # 虚主机那两档必须用 `localhost` 而不是 127.0.0.1：客户端要把桶名拼成首个标签
          # （`<bucket>.localhost`），而实例是按 `MINIO_DOMAIN=localhost` 认这个后缀的。
          S3_VHL_ENDPOINT: http://localhost:9000
          S3_VHL_AK: ${{ env.MINIO_USER }}
          S3_VHL_SK: ${{ env.MINIO_PASS }}
          S3_ACL_REFUSE_ENDPOINT: http://localhost:9000
          S3_ACL_REFUSE_AK: ${{ env.MINIO_USER }}
          S3_ACL_REFUSE_SK: ${{ env.MINIO_PASS }}
          MOONFS_RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          # 两条兼容平台腿打的是真公网桶。基址由区域拼出来（COS 只认虚主机，OSS 两种
          # 基址都被实测回拒 path 风格，见那两个文件头上的说明），凭据只走 secret。
          # secret 没到位时那四档会响亮跳过，并被下面的 want_skips 算进判据——
          # 缺凭据不会静默变绿，只会在 summary 里点名"本轮绿不含它们"。
          S3_COS_ENDPOINT: https://cos.${{ secrets.COS_REGION }}.myqcloud.com
          S3_COS_REGION: ${{ secrets.COS_REGION }}
          S3_COS_BUCKET: ${{ secrets.COS_BUCKET }}
          S3_COS_AK: ${{ secrets.COS_AK }}
          S3_COS_SK: ${{ secrets.COS_SK }}
          S3_OSS_ENDPOINT: https://oss-${{ secrets.OSS_REGION }}.aliyuncs.com
          S3_OSS_REGION: ${{ secrets.OSS_REGION }}
          S3_OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          S3_OSS_AK: ${{ secrets.OSS_AK }}
          S3_OSS_SK: ${{ secrets.OSS_SK }}
        run: |
          # pipefail 不许省：GH 默认只给 -e，`moon test | tee` 的退出码是 tee 的 0，
          # 真红的用例会被这条管道吃掉、只剩"Total tests" 那半句自证过关。
          # 判据因此打全串（passed 与 failed 都钉住），不认"总条数对得上"。
          set -o pipefail
          moon test --target wasm -j 1 --no-render | tee wasm-test.txt
          moon test --target native -j 1 --no-render | tee native-test.txt
          # 基准那一档是七牛那条公网 vhost 腿——runner 给不出可达地址，它每轮都响亮跳过。
          # 兼容平台腿的凭据到位几组，就少几档跳过；一组都没到位时这一轮**不含** COS／OSS，
          # 那句话必须出现在日志与 summary 里，不许被"49 条全绿"这种形状盖掉。
          want_skips=1
          [ -z "${S3_COS_AK:-}" ] && want_skips=$((want_skips + 4))
          [ -z "${S3_OSS_AK:-}" ] && want_skips=$((want_skips + 4))
          # Kodo 那两档在 CI 里固定跳过，是**有意**的：一条腿会先问 S3 面"你看得见哪些桶"，
          # 而答案取决于账号里哪个桶被接进这道门——那是账号状态，不该钉成 CI 的 secret，
          # 否则哪天桶的可见性一变，门禁红的原因跟代码毫无关系。它在本地门禁脚本里真跑
          # （两种桶各一条断言分支都覆盖过）。
          [ -z "${S3_KODO_AK:-}" ] && want_skips=$((want_skips + 2))
          if [ "$want_skips" != "1" ]; then
            echo "::warning::兼容平台腿有 $((want_skips - 1)) 档没被真跑（缺 secret）——本轮绿不含 COS／OSS"
            echo "兼容平台腿未真跑：缺 $((want_skips - 1)) 档（COS 四档／OSS 四档），本轮绿不含它们" >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in wasm-test.txt native-test.txt; do
            grep -q "Total tests: $EXPECTED_TESTS, passed: $EXPECTED_TESTS, failed: 0" "$f"
            skips=$(grep -c "SKIP IS NOT A PASS" "$f" || true)
            echo "$f：$EXPECTED_TESTS 条全绿已核，SKIP 行数=$skips（应为 $want_skips）"
            test "$skips" = "$want_skips"
          done
          grep -E "^SKIP IS NOT A PASS" wasm-test.txt | sed 's/^/  跳过的是：/' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: README snippet check
        run: |
          export MOON_HOME="$HOME/.moon"
          bash scripts/readme-check.sh

      - name: Generated interface is up to date
        run: |
          moon info --target wasm
          git diff --exit-code -- '*pkg.generated.mbti'

      - name: Formatting
        run: moon fmt --check

      - name: Assert zero warnings
        run: |
          moon check --target wasm --no-render 2>&1 | tee check.txt
          ! grep -q "Warning" check.txt

      # 腿内部本来就该自删（测完回查 0 残留）；这一步是兜底：跑挂了、红在中途，也把本轮这个桶清干净，
      # 并把"清掉几个对象"作为读数打出来，不只凭"命令返回 0"说清了。数据目录随 job 销毁。
      - name: Sweep and re-count this run's bucket
        if: always()
        env:
          MC_CONFIG_DIR: ${{ runner.temp }}/mc-config
        run: |
          MC="$RUNNER_TEMP/bin/mc"
          if [ -x "$MC" ]; then
            left=$("$MC" ls --recursive "local/$BUCKET" 2>/dev/null | wc -l)
            echo "清扫前本桶对象数=$left"
            "$MC" rm --recursive --force "local/$BUCKET" >/dev/null 2>&1 || true
            "$MC" rb "local/$BUCKET" >/dev/null 2>&1 || true
            echo "清扫后本桶对象数=$("$MC" ls --recursive "local/$BUCKET" 2>/dev/null | wc -l)"
            # 各腿自建自删的那些桶（虚主机两档与 ACL 档）应当已经不在了；这里只**记录**剩下什么，
            # 不据此判红——判红会跟"腿本身已经红"重复，而泄漏读数本身就是我们要看的信号。
            leftovers=$("$MC" ls local 2>/dev/null | awk '{print $NF}' | tr '\n' ' ' || true)
            echo "实例里剩下的桶：${leftovers:-（无）}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          pkill -f "minio server" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/moonfs-data"
          echo "本轮 MinIO 进程与数据目录已回收（桶与对象都在 RUNNER_TEMP 里，跨 job 不残留）" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish mldong/moon-s3 to mooncakes
    needs: verify
    # 判据是单数 'tag'：写成 'tags' 会让 tag 推送的整个 publish job 被 skip，而 workflow 结论
    # 照旧 success（moon-token 的 v0.1.7 就是这么静默漏发过一次）。下面第一步把三个值打进 log。
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What triggered this publish
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          echo "event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_type=$GITHUB_REF_TYPE"
          echo "publish input=$PUBLISH_INPUT version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' moon.mod | head -1)"

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" version

      - name: Preflight credentials present (values never printed)
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          [ -n "$MOON_TOKEN" ] || {
            echo "::error::secrets.MOON_TOKEN 没到位（org 级 secret 需把本仓放进可见范围，或在本仓建同名）"
            exit 1
          }
          [ -n "$MOON_USERNAME" ] || { echo "::error::secrets.MOON_USERNAME 没到位"; exit 1; }
          echo "凭证到位：token 长度 ${#MOON_TOKEN}（值不外泄），用户名 $MOON_USERNAME"

      - name: Write mooncakes credentials
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          mkdir -p "$HOME/.moon"
          printf '{"token":"%s","username":"%s"}\n' "$MOON_TOKEN" "$MOON_USERNAME" \
            > "$HOME/.moon/credentials.json"

      - name: Update index and install dependencies
        run: |
          moon update
          moon install

      - name: Publish (re-entrant, skip if the index already has this version)
        run: bash .github/scripts/publish-if-absent.sh . mldong/moon-s3

      # 上传 200／版本可见／用户装得到是三件事，这一步只认第三件：按新用户的路径建一个空工程，
      # 用 `moon add`（不给版本号，由注册表解析）引刚发上去的那一代，把解析到的 pin 打进 log，
      # 再真编译真跑。探针里的表达式抄自已过门禁的 README 代码块。
      # 为什么不用 `import { "mldong/moon-s3" }`：这个版本的 moon.mod 拒绝无版本号的 registry 依赖
      # （实测报 "moon.mod only supports versioned registry dependencies in import"）。
      - name: Consumer leg — install the just-published version and build against it
        run: |
          export MOON_HOME="$HOME/.moon"
          moon update
          probe="$RUNNER_TEMP/consumer-s3"
          rm -rf "$probe"; mkdir -p "$probe/lib"
          printf 'name = "mldong/consumer_probe_s3"\nversion = "0.0.0"\npreferred_target = "wasm"\n' > "$probe/moon.mod"
          printf 'import {\n  "mldong/moon-s3/s3" @sdk,\n}\n' > "$probe/lib/moon.pkg"
          printf 'test "the just-published module installs and works" {\n  assert_eq(\n    @sdk.xml_error_code("<Error><Code>NoSuchBucket</Code></Error>"),\n    "NoSuchBucket",\n  )\n}\n' > "$probe/lib/probe_test.mbt"
          cd "$probe"
          # 发布后索引与制品的传播有尾（上传 200 ≠ 装得到），故重试 3 次；次数进 summary。
          a=1
          until moon add mldong/moon-s3; do
            if [ "$a" -ge 3 ]; then
              echo "::error::连试 3 次都从注册表装不到刚发上去的 mldong/moon-s3 —— 这次是真没装得到"
              exit 1
            fi
            a=$((a + 1)); moon update >/dev/null 2>&1 || true; sleep 20
          done
          echo "consumer leg 安装所用尝试次数：$a / 3" >> "$GITHUB_STEP_SUMMARY"
          # 取 pin 用 `grep -o 'moon-s3@[0-9.]*'`：上一版这里写的是
          # `sed -nE 's/.*"(mldong\/moon-s3@[^"]+)".*/\1/p'`，而那行内容是我从被 GH 遮罩过的
          # 日志里抄回来的——`mldong` 已经被换成 `***`，于是这条 echo 恒空（探针本身照跑，
          # 但"解析到哪一代"这个读数一直是死格）。挑不含用户名的片段就没这个坑。
          echo "注册表解析到的 pin：$(grep -o 'moon-s3@[0-9.]*' moon.mod | head -1)"
          moon test --target wasm --no-render
